services:
  solo-agentic:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      MODEL_PROVIDER: gateway
      EVE_MODEL: openai/gpt-6-luna-fast
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - solo-data:/app/data
      - solo-workspace:/app/workspace
      - solo-eve:/app/.eve
      - solo-vault:/home/node/.solo-agentic
volumes:
  solo-data:
  solo-workspace:
  solo-eve:
  solo-vault:
